plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

repositories {
    mavenCentral()

    // JEI
    maven {
        name = 'Jareds Maven'
        url = 'https://maven.blamejared.com/'
    }

    // EMI
    maven {
        name = 'Sleeping Town'
        url = 'https://repo.sleeping.town/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // ------------------------------------------------------------
    // JEI 1.21.1 - optional compatibility
    // ------------------------------------------------------------

    // API only: lets Craft & Find compile its JEI integration without
    // making JEI a required dependency for players.
    modCompileOnly "mezz.jei:jei-1.21.1-common-api:19.44.0.405"
    modCompileOnly "mezz.jei:jei-1.21.1-fabric-api:19.44.0.405"

    // JEI enabled for the first dev test.
//    modLocalRuntime "mezz.jei:jei-1.21.1-fabric:19.44.0.405"

    // ------------------------------------------------------------
    // EMI 1.21.1 - optional compatibility
    // ------------------------------------------------------------

    modCompileOnly "dev.emi:emi-fabric:1.1.24+1.21.1:api"

    // Keep EMI disabled while testing JEI first.
    // To test EMI, comment JEI's modLocalRuntime above and uncomment this.
     modLocalRuntime "dev.emi:emi-fabric:1.1.24+1.21.1"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.mod_id
            from components.java
        }
    }
}
